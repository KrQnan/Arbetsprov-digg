%dev.quarkus.datasource.db-kind=sqlite
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:./mindatabas
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=data.sql
quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*
quarkus.log.console.json.print-details=true
#Test
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:mindatabas
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=testdata.sql

%prod.quarkus.datasource.db-kind=sqlite
%prod.quarkus.datasource.jdbc.url=jdbc:sqlite:./mindatabas
%prod.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.sql-load-script=data.sql

